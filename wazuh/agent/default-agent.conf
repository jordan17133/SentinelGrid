<!--
  Shared configuration for the Wazuh "default" agent group.
  Deployed by pasting into: Agents management > Groups > default > Files > agent.conf.
  Agents in the group receive it automatically and restart themselves to apply it.

  File integrity monitoring (FIM) notes:
  - whodata="yes" records which process and user made each change (Windows
    object-access auditing; implies real-time monitoring).
  - report_changes is deliberately left off. For secret files it would copy
    their contents (API keys) into Wazuh.
  - FIM detects creation, modification and deletion, not reads.
  - tags appear on every FIM alert, so rules, dashboards and notifications can
    filter by why a path is monitored.
-->
<agent_config>
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <!-- PowerShell script block logging (enabled by windows/Set-PowerShellScriptBlockLogging.ps1).
       Only event 4104, the deobfuscated script content; the channel's other events are routine. -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4104]</query>
  </localfile>
</agent_config>

<agent_config os="Windows">
  <syscheck>
    <!-- Scheduled scan (registry and anything real-time misses): hourly instead of the 12-hour default. -->
    <frequency>3600</frequency>

    <!-- Secrets: API keys, app configs, SSH keys, Wazuh install secrets. -->
    <directories whodata="yes" tags="sg-secrets">C:\Apps\Automation\.env</directories>
    <directories whodata="yes" tags="sg-secrets">C:\Apps\Automation\config\app.json</directories>
    <directories whodata="yes" tags="sg-secrets">C:\Apps\Automation\config\app_b.json</directories>
    <directories whodata="yes" tags="sg-secrets">C:\Apps\Automation\config\app_c.json</directories>
    <directories whodata="yes" tags="sg-secrets">C:\Users\Jordan\Desktop\SIEM-SOC\loader\.env</directories>
    <directories whodata="yes" tags="sg-secrets">C:\Users\Jordan\.ssh</directories>
    <directories whodata="yes" tags="sg-secrets">C:\Users\Jordan\Documents\SentinelGrid-Private</directories>

    <!-- Everything Task Scheduler runs automatically for the automation app. -->
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\tools\watchdog_launcher.vbs</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\jobs\job_a_watchdog_launcher.vbs</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\jobs\job_b_watchdog_launcher.vbs</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\tools\app_watchdog.ps1</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\jobs\job_a_watchdog.ps1</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\jobs\job_b_watchdog.ps1</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\jobs\daily_report.py</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\jobs\data_collector.py</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\jobs\ledger.py</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\tools\health_check.py</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\tools\validate.py</directories>
    <directories whodata="yes" tags="sg-sched-exec">C:\Apps\Automation\tools\trim_logs.py</directories>

    <!-- Classic persistence locations. -->
    <directories whodata="yes" tags="sg-persistence">C:\Users\Jordan\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories whodata="yes" tags="sg-persistence">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp</directories>
    <windows_registry arch="both" tags="sg-persistence">HKEY_USERS\S-1-5-21-<machine>-1001\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both" tags="sg-persistence">HKEY_USERS\S-1-5-21-<machine>-1001\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
  </syscheck>
</agent_config>
